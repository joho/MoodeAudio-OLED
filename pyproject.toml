[project]
name = "moode-oled"
version = "2.0.0"
description = "Modern OLED display integration for MoodeAudio 9.x (modernized fork of naisema/MoodeAudio-OLED)"
authors = [
    {name = "Suwat Saisema", email = "suwat.saisema@gmail.com"},
    {name = "Modernized for 2025"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
homepage = "https://github.com/naisema/MoodeAudio-OLED"
dependencies = [
    "adafruit-circuitpython-ssd1306>=2.0.0",
    "python-mpd2>=3.1.0",
    "pillow>=10.0.0",
    "RPi.GPIO>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
